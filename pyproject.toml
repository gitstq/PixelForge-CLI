[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pixelforge-cli"
version = "1.0.0"
description = "Lightweight Terminal ASCII Art Intelligent Generation & Conversion Engine"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "PixelForge Team"}
]
keywords = ["ascii", "art", "cli", "terminal", "text-to-ascii", "image-to-ascii", "banner", "figlet"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Artistic Software",
    "Topic :: Text Processing",
    "Topic :: Utilities",
]

dependencies = []

[project.optional-dependencies]
image = ["Pillow>=8.0.0"]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]
all = ["Pillow>=8.0.0"]

[project.scripts]
pixelforge = "pixelforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
